version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  cached_network_image: ^3.3.1
  connectivity_plus: ^5.0.2
  dio: ^5.0.0
  file_picker: ^8.1.6
  flutter:
