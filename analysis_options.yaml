include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.mocks.dart"
    - "**/*.freezed.dart"
    - lib/app/app.locator.dart
    - lib/app/app.router.dart
    - lib/app/app.bottomsheets.dart
    - lib/app/app.dialogs.dart
    - "**/*.form.dart"

linter:
  rules:
    public_member_api_docs: false
